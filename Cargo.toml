[package]
name = "osmo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = []
alloc = []
std = ["alloc"]
parallel = ["std"]

[dependencies]

[dev-dependencies]
osmo = { path = ".", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
